name: Build Web Assets

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Project
        run: npm run build

      - name: Verify server function boots
        run: |
          FUNC=".vercel/output/functions/__server.func/index.mjs"
          if [ -f "$FUNC" ]; then
            node -e "import('./$FUNC').then(()=>console.log('BOOT OK')).catch(e=>{console.error('BOOT FAIL:', e.code, e.message.split('\n')[0]);process.exit(1)})"
          else
            echo "No .vercel/output function produced — skipping boot check"
          fi

      - name: Find and Package Output Folder
        run: |
          if [ -d "dist" ]; then
            echo "TARGET_DIR=dist" >> $GITHUB_ENV
          elif [ -d ".vercel/output/public" ]; then
            echo "TARGET_DIR=.vercel/output/public" >> $GITHUB_ENV
          elif [ -d ".vercel/output" ]; then
            echo "TARGET_DIR=.vercel/output" >> $GITHUB_ENV
          elif [ -d ".output/public" ]; then
            echo "TARGET_DIR=.output/public" >> $GITHUB_ENV
          elif [ -d ".output" ]; then
            echo "TARGET_DIR=.output" >> $GITHUB_ENV
          elif [ -d "build" ]; then
            echo "TARGET_DIR=build" >> $GITHUB_ENV
          else
            echo "No build folder found!" && exit 1
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: ${{ env.TARGET_DIR }}
